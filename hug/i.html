<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Hug Story 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#ffffff;
color:#4c1d95;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at center,#f3e8ff,#ffffff 70%);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%, rgba(192,132,252,0.3), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(168,85,247,0.25), transparent 40%);
animation:floatGlow 12s infinite alternate ease-in-out;
z-index:-1;
}

@keyframes floatGlow{
0%{transform:translateY(-20px);}
100%{transform:translateY(20px);}
}

.section{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px 20px;
transition:1s ease;
}

h1{
font-family:'Dancing Script',cursive;
font-size:64px;
margin-bottom:20px;
color:#6d28d9;
text-shadow:
0 0 10px rgba(168,85,247,0.6),
0 0 20px rgba(168,85,247,0.4),
0 0 35px rgba(168,85,247,0.3);
animation:romanticPulse 3s infinite alternate;
}

@keyframes romanticPulse{
0%{text-shadow:0 0 10px rgba(168,85,247,0.5);}
100%{text-shadow:0 0 30px rgba(168,85,247,0.9);}
}

p{
max-width:700px;
font-size:20px;
line-height:1.8;
color:#3b0764;
margin-bottom:30px;
}

button{
padding:14px 36px;
border:none;
border-radius:40px;
font-size:16px;
background:linear-gradient(45deg,#8b5cf6,#7c3aed);
color:white;
cursor:pointer;
transition:0.3s;
box-shadow:
0 0 15px rgba(124,58,237,0.6),
0 0 30px rgba(124,58,237,0.3);
}

button:hover{
transform:scale(1.08);
box-shadow:
0 0 25px rgba(124,58,237,0.9),
0 0 45px rgba(124,58,237,0.6);
}

.hidden{
opacity:0;
pointer-events:none;
transform:scale(1.05);
}

.hug3d{
font-size:110px;
margin:20px 0;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

.slider{
width:90%;
max-width:650px;
height:350px;
overflow:hidden;
border-radius:20px;
border:2px solid #c084fc;
box-shadow:
0 0 20px rgba(168,85,247,0.5),
0 0 40px rgba(168,85,247,0.3);
margin-bottom:30px;
background:white;
position:relative;
}

.slides{
display:flex;
height:100%;
animation:slide 12s infinite;
}

.slides img{
width:100%;
height:100%;
object-fit:contain;
background:white;
flex-shrink:0;
}

@keyframes slide{
0%{transform:translateX(0);}
33%{transform:translateX(0);}
36%{transform:translateX(-100%);}
66%{transform:translateX(-100%);}
69%{transform:translateX(-200%);}
100%{transform:translateX(-200%);}
}

.heart{
position:absolute;
color:#a855f7;
font-size:20px;
animation:fly 1s ease forwards;
pointer-events:none;
}

@keyframes fly{
0%{transform:translateY(0) scale(1);opacity:1;}
100%{transform:translateY(-120px) scale(1.8);opacity:0;}
}

.spark{
position:absolute;
width:6px;
height:6px;
background:#7c3aed;
border-radius:50%;
animation:spark 0.8s ease-out forwards;
}

@keyframes spark{
0%{transform:scale(1);opacity:1;}
100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}
}

.hugImage{
width:220px;
margin:20px 0;
animation:pulse 2s infinite;
filter:drop-shadow(0 0 20px rgba(168,85,247,0.6));
}

.typing-text{
max-width:600px;
font-size:22px;
color:#6d28d9;
min-height:60px;
margin-bottom:30px;
}

.petal{
position:fixed;
top:-20px;
font-size:18px;
color:#c084fc;
opacity:0.8;
pointer-events:none;
animation:fall linear forwards;
z-index:10;
filter:drop-shadow(0 0 6px rgba(168,85,247,0.6));
}

@keyframes fall{
0%{transform:translateY(0) rotate(0deg);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}
</style>
</head>
<body>

<audio id="bgMusic" src="dooron-dooron-updated.mp3" loop></audio>

<!-- PAGE 1 -->
<div class="section" id="page1">
<h1>Happy Hug Day 🤍</h1>
<p>If distance had a heart, it would break tonight…  
Because all I want right now… is to hold you close.</p>
<button onclick="nextPage(event)">Come Into My Arms 💜</button>
</div>

<!-- PAGE 2 -->
<div class="section hidden" id="page2">
<h1>Feel My Hug 💞</h1>
<div class="hug3d">🫂</div>
<div class="typing-text" id="loveText2"></div>
<button onclick="openMemories(event)">Our Memories ✨</button>
</div>

<!-- PAGE 3 -->
<div class="section hidden" id="page3">
<h1>Our Beautiful Moments 💖</h1>
<div class="slider">
<div class="slides">
<img src="1.png">
<img src="2.png">
<img src="3.png">
</div>
</div>
<p>Will You Hug Me Forever? 🤍</p>
<button onclick="finalMoment(event)">Yes… Forever ♾</button>
</div>

<!-- PAGE 4 -->
<div class="section hidden" id="page4">
<h1>Forever Starts With This Hug 💜</h1>
<div class="typing-text" id="loveText"></div>
<img src="last-removebg-preview.png" class="hugImage">
</div>

<script>
let musicStarted=false;
function startMusic(){
if(!musicStarted){
document.getElementById("bgMusic").play();
musicStarted=true;
}
}

function hearts(x,y){
for(let i=0;i<8;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=x+"px";
h.style.top=y+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
}
}

function sparkExplosion(x,y){
for(let i=0;i<20;i++){
let s=document.createElement("div");
s.className="spark";
s.style.left=x+"px";
s.style.top=y+"px";
s.style.setProperty('--x',(Math.random()*200-100)+"px");
s.style.setProperty('--y',(Math.random()*200-100)+"px");
document.body.appendChild(s);
setTimeout(()=>s.remove(),800);
}
}

function nextPage(e){
startMusic();
hearts(e.clientX,e.clientY);
document.getElementById("page1").classList.add("hidden");
document.getElementById("page2").classList.remove("hidden");

/* Start typing on Page 2 */
j=0;
document.getElementById("loveText2").innerHTML="";
typeWriter2();
}

function openMemories(e){
hearts(e.clientX,e.clientY);
document.getElementById("page2").classList.add("hidden");
document.getElementById("page3").classList.remove("hidden");
}

function finalMoment(e){
sparkExplosion(e.clientX,e.clientY);
document.getElementById("page3").classList.add("hidden");
document.getElementById("page4").classList.remove("hidden");
startPetals();
typeWriter();
}

/* Page 4 Typing */
const message="No matter where life takes us, my arms will always be your safest place. This hug is not for today… It’s for every tomorrow. 🤍 I Love You🤍 ";
let i=0;
function typeWriter(){
if(i<message.length){
document.getElementById("loveText").innerHTML+=message.charAt(i);
i++;
setTimeout(typeWriter,90);
}
}

/* Page 2 Typing */
const message2="Close your eyes… Imagine my arms wrapped around you tightly, protecting you, loving you, choosing you — every single day. 💞";
let j=0;
function typeWriter2(){
if(j<message2.length){
document.getElementById("loveText2").innerHTML+=message2.charAt(j);
j++;
setTimeout(typeWriter2,90);
}
}

function startPetals(){
setInterval(()=>{
let petal=document.createElement("div");
petal.className="petal";
petal.innerHTML="❀";
petal.style.left=Math.random()*100+"vw";
petal.style.animationDuration=(4+Math.random()*3)+"s";
document.body.appendChild(petal);
setTimeout(()=>petal.remove(),7000);
},300);
}
</script>

</body>
</html>
